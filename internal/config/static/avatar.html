<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dora</title>
<style>
  body{margin:0;overflow:hidden;background:#00ff00;}
  #info{position:fixed;top:8px;left:8px;color:#fff;font-family:monospace;font-size:12px;background:#0008;padding:4px 8px;border-radius:4px;}
</style>
</head>
<body>
<div id="info">carregando...</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.1/lib/three-vrm.module.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const info = document.getElementById('info');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.3, 1.5);
const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.DirectionalLight(0xffffff, Math.PI));
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

let vrm = null;
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
loader.load('/avatar.vrm', (gltf) => {
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  info.textContent = 'Dora carregada';
}, undefined, (e) => { info.textContent = 'erro: coloque avatar.vrm na pasta static'; });

// estado vindo do bot
let state = { mood:'neutra', speaking:false };
function connectWS(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => { state = JSON.parse(e.data); };
  ws.onclose = () => setTimeout(connectWS, 1000);
}
connectWS();

// mapa humor -> expressão VRM
const moodExpr = { animada:'happy', zoeira:'happy', provocada:'angry', surpresa:'surprised', entediada:'sad', neutra:'neutral' };

// piscar automático
let blinkT = 0, nextBlink = 2;
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  if (vrm) {
    const em = vrm.expressionManager;
    if (em) {
      // reseta expressões de humor
      ['happy','angry','sad','surprised','neutral'].forEach(x => em.setValue(x, 0));
      const expr = moodExpr[state.mood] || 'neutral';
      em.setValue(expr, 0.8);
      // piscar
      blinkT += dt;
      let blink = 0;
      if (blinkT > nextBlink) { blink = 1; if (blinkT > nextBlink+0.15){ blinkT=0; nextBlink=2+Math.random()*3; } }
      em.setValue('blink', blink);
      // lip sync: boca oscila quando falando
      const mouth = state.speaking ? (Math.sin(t*18)*0.5+0.5)*0.7 : 0;
      em.setValue('aa', mouth);
    }
    // respirar: leve balanço
    if (vrm.humanoid) {
      const chest = vrm.humanoid.getNormalizedBoneNode('chest');
      if (chest) chest.rotation.x = Math.sin(t*1.2)*0.02;
    }
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
