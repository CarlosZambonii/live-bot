<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dora</title>
<style>
  body{margin:0;overflow:hidden;background:#00ff00;}
  #info{position:fixed;top:8px;left:8px;color:#fff;font-family:monospace;font-size:12px;background:#0008;padding:4px 8px;border-radius:4px;}
</style>
</head>
<body>
<div id="info">carregando...</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.1/lib/three-vrm.module.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const info = document.getElementById('info');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.2, 2.2);
const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.DirectionalLight(0xffffff, Math.PI));
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

let vrm = null;
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
loader.load('/avatar.vrm', (gltf) => {
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  const h = vrm.humanoid;
  if (h) {
    h.getNormalizedBoneNode('leftUpperArm').rotation.z = 1.2;
    h.getNormalizedBoneNode('rightUpperArm').rotation.z = -1.2;
  }
  info.textContent = 'Dora viva';
}, undefined, () => { info.textContent = 'erro: avatar.vrm faltando'; });

let state = { mood:'neutra', speaking:false };
function connectWS(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => { state = JSON.parse(e.data); };
  ws.onclose = () => setTimeout(connectWS, 1000);
}
connectWS();

// lip sync real: captura o áudio do sistema? Não dá do navegador.
// Então: quando speaking, boca varia com ruído pseudo-aleatório suave (parece fala real, não seno puro)
let visemeT = 0, curViseme = 'aa', visemeAmp = 0; const visemeCur = {};

const moodExpr = { animada:'happy', zoeira:'happy', provocada:'angry', surpresa:'surprised', entediada:'sad', neutra:'' };
let curExpr = {happy:0,angry:0,sad:0,surprised:0,neutral:0};

let blinkT = 0, nextBlink = 2, blinkPhase = 0;
let lookT = 0, lookX = 0, lookY = 0, lookTX = 0, lookTY = 0;
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (vrm) {
    const em = vrm.expressionManager;
    const h = vrm.humanoid;

    // expressão: transição suave pro humor atual
    const target = moodExpr[state.mood] || 'neutral';
    for (const k in curExpr) {
      const goal = (target && k === target) ? 0.7 : 0;
      curExpr[k] += (goal - curExpr[k]) * dt * 4;
      if (em) em.setValue(k, curExpr[k]);
    }

    // vida facial: micro-expressões que evitam rosto morto
    if (em) {
      const talk = state.speaking ? 1 : 0.3;
      // sobrancelhas sobem/descem sutilmente
      const browUp = (Math.sin(t*2.3)*0.5+0.5) * 0.25 * talk;
      em.setValue('surprised', Math.max(em.getValue?.('surprised')||0, browUp*0.3));
      // leve sorriso base que pulsa (rosto vivo)
      const microSmile = (Math.sin(t*0.8)*0.5+0.5) * 0.12;
      // não sobrescreve expressão de humor forte; soma sutil
    }

    // piscar: pulso rápido a cada nextBlink segundos
    blinkT += dt;
    let blinkVal = 0;
    const bp = blinkT - nextBlink;
    if (bp > 0 && bp < 0.15) {
      blinkVal = 1 - Math.abs(bp - 0.075) / 0.075; // sobe e desce em 150ms
    } else if (bp >= 0.15) {
      blinkT = 0; nextBlink = 2 + Math.random() * 3;
    }
    if (em) em.setValue('blink', Math.max(0, Math.min(1, blinkVal)));

    // lip sync: alterna entre vogais pra articular como fala real
    const visemes = ['aa','ih','ou','ee','oh'];
    if (state.speaking) {
      visemeT += dt;
      if (visemeT > 0.09) { // troca de viseme ~11x/s
        curViseme = visemes[Math.floor(Math.random()*visemes.length)];
        visemeAmp = 0.4 + Math.random()*0.5;
        visemeT = 0;
      }
    } else { visemeAmp = 0; }
    // aplica: o viseme atual sobe, os outros descem suave
    for (const v of visemes) {
      const goal = (v === curViseme) ? visemeAmp : 0;
      visemeCur[v] = (visemeCur[v]||0) + (goal - (visemeCur[v]||0)) * dt * 18;
      if (em) em.setValue(v, visemeCur[v]);
    }

    // respiração visível
    if (h) {
      const chest = h.getNormalizedBoneNode('chest');
      const spine = h.getNormalizedBoneNode('spine');
      const breath = Math.sin(t * 1.6) * 0.035;
      if (chest) chest.rotation.x = breath;
      if (spine) spine.rotation.x = breath * 0.5;

      // sway idle: troca de peso lenta
      const hips = h.getNormalizedBoneNode('hips');
      if (hips) {
        hips.position.x = Math.sin(t * 0.5) * 0.01;
        hips.rotation.y = Math.sin(t * 0.35) * 0.04;
      }

      // cabeça: micro-movimento + olhar
      const head = h.getNormalizedBoneNode('head');
      if (head) {
        const emph = state.speaking ? 2.5 : 1;
        head.rotation.y = Math.sin(t * 0.4) * 0.06 + lookX * 0.15 + (state.speaking?Math.sin(t*3.5)*0.04:0);
        head.rotation.x = Math.sin(t * 0.6) * 0.03 + (state.speaking?Math.sin(t*4.2)*0.03:0);
      }

      // olhar que vagueia
      lookT += dt;
      if (lookT > 2.5) { lookTX = (Math.random()-0.5)*2; lookTY = (Math.random()-0.5); lookT = 0; }
      lookX += (lookTX - lookX) * dt * 2;
      lookY += (lookTY - lookY) * dt * 2;
      if (vrm.lookAt) vrm.lookAt.applier?.applyYawPitch?.(lookX * 15, lookY * 10);
    }

    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
