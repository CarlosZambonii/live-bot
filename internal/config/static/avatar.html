<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dora</title>
<style>
  body{margin:0;overflow:hidden;background:#00ff00;}
  #info{position:fixed;top:8px;left:8px;color:#fff;font-family:monospace;font-size:12px;background:#0008;padding:4px 8px;border-radius:4px;}
</style>
</head>
<body>
<div id="info">carregando...</div>
<div id="legenda" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);max-width:80%;text-align:center;font-family:system-ui,sans-serif;font-size:26px;font-weight:600;color:#fff;text-shadow:0 2px 6px #000,0 0 12px #000;padding:8px 16px;opacity:0;transition:opacity .3s;"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.js",
  "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip, VRMLookAtQuaternionProxy } from '@pixiv/three-vrm-animation';

const info = document.getElementById('info');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.0, 3.0);
camera.lookAt(0, 1.0, 0);
const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const dirLight = new THREE.DirectionalLight(0xffffff, Math.PI);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// --- EMOTES ANIME (ícones sobre a cabeça) ---
function makeEmote(emoji){
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.font = '96px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 64, 72);
  const tex = new THREE.CanvasTexture(cv);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  spr.scale.set(0.3, 0.3, 0.3);
  spr.visible = false;
  scene.add(spr);
  return spr;
}
const sceneObjects = {
  suor:    makeEmote('💧'),
  coracao: makeEmote('❤️'),
  zzz:     makeEmote('💤'),
  surpresa:makeEmote('❗'),
  nota:    makeEmote('🎵'),
  raiva:   makeEmote('💢'),
};
let forcedObject = null;

// --- PARTÍCULAS (corações, faíscas subindo) ---
const particles = [];
function spawnParticle(emoji){
  const cv = document.createElement('canvas'); cv.width=64; cv.height=64;
  const ctx = cv.getContext('2d');
  ctx.font='48px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(emoji, 32, 36);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), transparent:true }));
  spr.scale.set(0.15,0.15,0.15);
  const angle = Math.random()*Math.PI*2;
  spr.position.set(Math.cos(angle)*0.3, 0.8+Math.random()*0.4, Math.sin(angle)*0.2);
  spr.userData = { life:0, vy:0.3+Math.random()*0.3, vx:(Math.random()-0.5)*0.2 };
  scene.add(spr);
  particles.push(spr);
}
let particleT = 0;

let vrm = null, mixer = null, currentAction = null;
const animClips = {}; // nome -> AnimationClip

const gltfLoader = new GLTFLoader();
gltfLoader.crossOrigin = 'anonymous';
gltfLoader.register(p => new VRMLoaderPlugin(p));
gltfLoader.register(p => new VRMAnimationLoaderPlugin(p));
const vrmaLoader = gltfLoader;

gltfLoader.load('/avatar.vrm', (gltf) => {
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  const h = vrm.humanoid;
  if (h) {
    h.getNormalizedBoneNode('leftUpperArm').rotation.z = 1.2;
    h.getNormalizedBoneNode('rightUpperArm').rotation.z = -1.2;
  }
  const proxy = new VRMLookAtQuaternionProxy(vrm.lookAt);
  proxy.name = 'lookAtQuaternionProxy';
  vrm.scene.add(proxy);
  mixer = new THREE.AnimationMixer(vrm.scene);
  info.textContent = 'Dora viva';
}, undefined, () => { info.textContent = 'erro: avatar.vrm faltando'; });

// carrega uma vrma sob demanda e cacheia o clip
async function loadAnim(name){
  if (animClips[name]) return animClips[name];
  return new Promise((res, rej) => {
    vrmaLoader.load('/vrma/'+name+'.vrma', (gltf) => {
      console.log('vrma full userData:', gltf.userData); console.log('animations arr:', gltf.animations);
      const vrmAnim = gltf.userData.vrmAnimations?.[0];
      if (!vrmAnim || !vrm) return rej('sem anim');
      const clip = createVRMAnimationClip(vrmAnim, vrm);
      animClips[name] = clip;
      res(clip);
    }, undefined, rej);
  });
}

async function playAnim(name){
  if (!mixer || !vrm) return;
  try {
    const clip = await loadAnim(name);
    const action = mixer.clipAction(clip);
    action.reset();
    action.setLoop(THREE.LoopOnce);
    action.clampWhenFinished = true;
    if (currentAction) currentAction.fadeOut(0.3);
    action.fadeIn(0.3).play();
    currentAction = action;
    info.textContent = 'animando: '+name;
  } catch(e){ console.log('anim erro', name, e); }
}
window.playAnim = playAnim;
window.showObject = (name) => { forcedObject = (name === 'none') ? null : name; };
window.setMood = (m) => { state.mood = m; };

// soundboard: efeitos sintéticos (trocar por mp3 depois)
let audioCtx = null;
function sfx(type){
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  if (type === 'rimshot'){
    [0,0.12,0.24].forEach((d,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value= i<2?200:120; o.type='triangle';
      g.gain.setValueAtTime(0.3,now+d); g.gain.exponentialRampToValueAtTime(0.01,now+d+0.1);
      o.connect(g); g.connect(audioCtx.destination); o.start(now+d); o.stop(now+d+0.1);
    });
  } else if (type === 'ding'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(0.3,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.4);
    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+0.4);
  }
}
window.sfx = sfx;


let state = { mood:'neutra', speaking:false };
function connectWS(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const s = JSON.parse(e.data);
    if (s.anim && s.anim !== state.anim) playAnim(s.anim);
    if (s.sfx && s.sfx !== state.sfx) sfx(s.sfx);
    const leg = document.getElementById('legenda');
    if (s.speaking && s.said) { leg.textContent = s.said; leg.style.opacity = 1; }
    else if (!s.speaking) { leg.style.opacity = 0; }
    state = s;
  };
  ws.onclose = () => setTimeout(connectWS, 1000);
}
connectWS();

const moodExpr = { animada:'happy', zoeira:'happy', provocada:'angry', surpresa:'surprised', entediada:'sad', neutra:'' };
let curExpr = {happy:0,angry:0,sad:0,surprised:0,neutral:0};
let visemeT = 0, curViseme = 'aa', visemeAmp = 0; const visemeCur = {};
let blinkT = 0, nextBlink = 2;
let lookT = 0, lookX = 0, lookY = 0, lookTX = 0, lookTY = 0;
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (mixer) mixer.update(dt);
  // iluminação por humor (transição suave de cor)
  const moodLight = {
    animada:   [1.0, 0.95, 0.7],  // quente/vibrante
    zoeira:    [1.0, 0.8, 0.9],   // rosado
    provocada: [1.0, 0.7, 0.6],   // avermelhado
    surpresa:  [0.9, 0.95, 1.0],  // frio/branco
    entediada: [0.7, 0.75, 0.9],  // azulado/apagado
    neutra:    [1.0, 1.0, 1.0],
  };
  const target = moodLight[state.mood] || moodLight.neutra;
  dirLight.color.r += (target[0] - dirLight.color.r) * dt * 2;
  dirLight.color.g += (target[1] - dirLight.color.g) * dt * 2;
  dirLight.color.b += (target[2] - dirLight.color.b) * dt * 2;
  // partículas por humor
  const moodParticle = { zoeira:'❤️', animada:'✨', provocada:'💢', surpresa:'⭐' };
  const pEmoji = moodParticle[state.mood];
  particleT += dt;
  if (pEmoji && particleT > 0.5) { spawnParticle(pEmoji); particleT = 0; }
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.userData.life += dt;
    p.position.y += p.userData.vy * dt;
    p.position.x += p.userData.vx * dt;
    p.material.opacity = Math.max(0, 1 - p.userData.life/2);
    if (p.userData.life > 2) { scene.remove(p); particles.splice(i,1); }
  }
  // emotes: forçado (teste) ou por humor
  for (const k in sceneObjects) sceneObjects[k].visible = false;
  const moodEmote = { entediada:'zzz', animada:'nota', zoeira:'coracao', provocada:'raiva', surpresa:'surpresa' };
  const forced = forcedObject || state.object || moodEmote[state.mood];
  if (forced && sceneObjects[forced]) {
    const spr = sceneObjects[forced];
    spr.visible = true;
    // flutua sobre a cabeça (direita), com bobbing
    if (vrm && vrm.humanoid) {
      const head = vrm.humanoid.getNormalizedBoneNode('head');
      if (head) {
        const p = new THREE.Vector3();
        head.getWorldPosition(p);
        spr.position.set(p.x + 0.18, p.y + 0.22 + Math.sin(t*3)*0.02, p.z);
      }
    }
  }
  if (vrm) {
    const em = vrm.expressionManager;
    const h = vrm.humanoid;
    const target = moodExpr[state.mood] || '';
    for (const k in curExpr) {
      const goal = (target && k === target) ? 0.7 : 0;
      curExpr[k] += (goal - curExpr[k]) * dt * 4;
      if (em) em.setValue(k, curExpr[k]);
    }
    // vida facial
    if (em) {
      const talk = state.speaking ? 1 : 0.3;
      const browUp = (Math.sin(t*2.3)*0.5+0.5) * 0.25 * talk;
      em.setValue('surprised', Math.max(em.getValue?.('surprised')||0, browUp*0.3));
    }
    // piscar
    blinkT += dt;
    let blinkVal = 0;
    const bp = blinkT - nextBlink;
    if (bp > 0 && bp < 0.15) blinkVal = 1 - Math.abs(bp - 0.075)/0.075;
    else if (bp >= 0.15) {
      blinkT = 0;
      // humor muda o ritmo: animada pisca rápido, entediada devagar
      let base = 3;
      if (state.mood === 'animada' || state.mood === 'surpresa') base = 1.5;
      else if (state.mood === 'entediada') base = 5;
      nextBlink = base + Math.random()*2;
    }
    if (em) em.setValue('blink', Math.max(0, Math.min(1, blinkVal)));
    // lip sync visemes
    const visemes = ['aa','ih','ou','ee','oh'];
    const amp = state.mouth || 0; // amplitude REAL do audio
    if (state.speaking && amp > 0.02) {
      visemeT += dt;
      if (visemeT > 0.08) { curViseme = visemes[Math.floor(Math.random()*visemes.length)]; visemeT = 0; }
      visemeAmp = amp; // boca abre proporcional ao volume real
    } else visemeAmp = 0;
    for (const v of visemes){ const goal=(v===curViseme)?visemeAmp:0; visemeCur[v]=(visemeCur[v]||0)+(goal-(visemeCur[v]||0))*dt*18; if(em) em.setValue(v, visemeCur[v]); }
    // idle sutil só quando NÃO tem animação tocando
    const idle = !currentAction || !currentAction.isRunning();
    if (h && idle) {
      const chest = h.getNormalizedBoneNode('chest');
      if (chest) chest.rotation.x = Math.sin(t*1.6)*0.035;
      const head = h.getNormalizedBoneNode('head');
      if (head) { head.rotation.y = Math.sin(t*0.4)*0.06 + lookX*0.15; head.rotation.x = Math.sin(t*0.6)*0.03; }
      lookT += dt;
      if (state.speaking) {
        // falando: olha pra frente (streamer), com micro-variação
        lookTX = Math.sin(t*1.5)*0.15; lookTY = 0;
      } else if (lookT > 2.5) {
        lookTX=(Math.random()-0.5)*2; lookTY=(Math.random()-0.5); lookT=0;
      }
      lookX += (lookTX-lookX)*dt*3; lookY += (lookTY-lookY)*dt*3;
    }
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
