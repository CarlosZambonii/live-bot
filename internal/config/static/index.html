<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Backseat — Painel da Dora</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --tx:#e6e6ef; --mut:#8b8fa3; --ac:#7c5cff; --ok:#3ddc84; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,sans-serif; }
  body { background:var(--bg); color:var(--tx); padding:24px; max-width:720px; margin:0 auto; }
  h1 { font-size:20px; margin-bottom:4px; }
  .status { font-size:13px; color:var(--mut); margin-bottom:20px; }
  .status.on::before { content:"● "; color:var(--ok); }
  .status.off::before { content:"● "; color:#e05252; }
  .card { background:var(--card); border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h2 { font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; }
  textarea { width:100%; min-height:130px; background:#12141c; color:var(--tx); border:1px solid #2a2e3d; border-radius:8px; padding:10px; font-size:14px; resize:vertical; }
  .presets { display:flex; gap:8px; margin-top:10px; }
  button { background:var(--ac); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button.ghost { background:#2a2e3d; }
  button:hover { filter:brightness(1.15); }
  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; }
  .row label { font-size:14px; flex:1; }
  .row .val { font-size:13px; color:var(--ac); min-width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { flex:2; accent-color:var(--ac); }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--ac); }
  .save { width:100%; padding:12px; font-size:15px; margin-top:4px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ok); color:#06220f; padding:10px 20px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .3s; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<h1>🎙️ Painel da Dora</h1>
<div class="status off" id="status">verificando...</div>

<div class="card">
  <h2>Persona</h2>
  <textarea id="persona"></textarea>
  <div class="presets">
    <button class="ghost" onclick="preset('seria')">Séria</button>
    <button class="ghost" onclick="preset('zoeira')">Zoeira</button>
  </div>
</div>

<div class="card">
  <h2>Comportamento</h2>
  <div class="row"><label>Cooldown de menção</label><input type="range" id="mention_cooldown_s" min="10" max="180" step="5"><span class="val" id="v_mention"></span></div>
  <div class="row"><label>Cooldown de espontânea</label><input type="range" id="spont_cooldown_s" min="30" max="600" step="10"><span class="val" id="v_spont"></span></div>
  <div class="row"><label>Chance de espontânea</label><input type="range" id="spont_chance" min="0" max="1" step="0.05"><span class="val" id="v_chance"></span></div>
  <div class="row"><label>Cooldown de autônoma (tela)</label><input type="range" id="auto_cooldown_s" min="30" max="600" step="10"><span class="val" id="v_auto"></span></div>
  <div class="row"><label>Sensibilidade do mic (VAD)</label><input type="range" id="vad_threshold" min="100" max="2000" step="50"><span class="val" id="v_vad"></span></div>
  <div class="row"><label>Visão (screenshots)</label><input type="checkbox" id="vision"></div>
</div>

<button class="save" onclick="save()">Aplicar ao vivo</button>
<div class="toast" id="toast">Aplicado! A Dora já mudou.</div>

<script>
const API = '/config';
const PRESETS = {
  seria: `Você é a Dora, co-host de IA de uma live. Sua voz é transmitida NA LIVE: streamer e chat te ouvem. Responda viewers pelo nick quando chamada.\nPersonalidade: direta, calma e profissional. Sem piada, sem gíria.\nRegras: UMA frase, máximo 15 palavras. Sem emojis, sem listas. Português brasileiro.`,
  zoeira: `Você é a Dora, co-host de IA de uma live. Sua voz é transmitida NA LIVE: streamer e chat te ouvem. Responda viewers pelo nick quando chamada.\nPersonalidade: zoeira, sarcástica, debochada mas parceira. Zoa o streamer quando erra, comemora com deboche quando acerta. Gíria brasileira.\nRegras: UMA frase, máximo 15 palavras. Sem emojis, sem listas.`
};
const fields = ['mention_cooldown_s','spont_cooldown_s','spont_chance','auto_cooldown_s','vad_threshold'];
const fmt = { mention_cooldown_s:v=>v+'s', spont_cooldown_s:v=>v+'s', spont_chance:v=>Math.round(v*100)+'%', auto_cooldown_s:v=>v+'s', vad_threshold:v=>v };
const valId = { mention_cooldown_s:'v_mention', spont_cooldown_s:'v_spont', spont_chance:'v_chance', auto_cooldown_s:'v_auto', vad_threshold:'v_vad' };

fields.forEach(f => {
  document.getElementById(f).addEventListener('input', e => {
    document.getElementById(valId[f]).textContent = fmt[f](e.target.value);
  });
});

function preset(name){ document.getElementById('persona').value = PRESETS[name]; }

async function load(){
  try {
    const r = await fetch(API); const c = await r.json();
    document.getElementById('status').className = 'status on';
    document.getElementById('status').textContent = 'bot online';
    document.getElementById('persona').value = c.persona;
    fields.forEach(f => {
      document.getElementById(f).value = c[f];
      document.getElementById(valId[f]).textContent = fmt[f](c[f]);
    });
    document.getElementById('vision').checked = c.vision;
  } catch {
    document.getElementById('status').className = 'status off';
    document.getElementById('status').textContent = 'bot offline — suba o backseat';
  }
}

async function save(){
  const body = { persona: document.getElementById('persona').value, vision: document.getElementById('vision').checked };
  fields.forEach(f => body[f] = parseFloat(document.getElementById(f).value));
  await fetch(API, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const t = document.getElementById('toast');
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000);
}

load(); setInterval(load, 15000);
</script>
</body>
</html>
